[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpi-sppy-multistage-stochastic-planning"
version = "0.1.0"
description = "Three-stage stochastic production planning with Pyomo and mpi-sppy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mpi-sppy==0.14.0",
  "pyomo>=6.8",
  "highspy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
multistage-planning-demo = "stoch_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=stoch_planning --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
